# Configuración minimalista de btop (estética TUI monocromática estilo tuigreet)

color_theme = "tuigreet-mono"
theme_background = True
truecolor = True
force_tty = False

presets = "cpu:1:default,proc:0:default cpu:0:default,mem:0:default,net:0:default cpu:0:block,net:0:tty"
vim_keys = True
rounded_corners = False
graph_symbol = "braille"
shown_boxes = "cpu mem proc"
update_ms = 1500
proc_sorting = "cpu lazy"
proc_reversed = False
proc_tree = False
proc_colors = True
proc_gradient = True
proc_per_core = False
proc_mem_bytes = True
proc_cpu_graphs = True
proc_filter_kernel = False
show_battery = True
clock_format = "%H:%M"
