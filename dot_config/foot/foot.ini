# Configuración de foot — Estética TUI (tuigreet)

font=MesloLGL Nerd Font Mono:size=10
dpi-aware=no
pad=8x8
shell=/usr/bin/fish

[csd]
preferred=none
size=0
border-width=0

[colors-dark]
alpha=0.85
background=000000
foreground=e6e6e6
cursor=000000 ffffff
selection-background=e6e6e6
selection-foreground=000000

regular0=000000
regular1=e06c75
regular2=98c379
regular3=e5c07b
regular4=d946ef
regular5=c678dd
regular6=56b6c2
regular7=d0d0d0

bright0=555555
bright1=ff7a85
bright2=b5e890
bright3=f5d08a
bright4=f0abfc
bright5=dda0f0
bright6=76d6e2
bright7=ffffff

[key-bindings]
primary-paste=none
clipboard-copy=Control+Shift+c Super+c Super+x
clipboard-paste=Control+Shift+v Super+v Shift+Insert
