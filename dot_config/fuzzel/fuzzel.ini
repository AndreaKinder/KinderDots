# Estética TUI monocromática minimalista (a juego con Waybar / tuigreet)

[main]
font=DejaVu Sans Mono:size=9
dpi-aware=no
use-bold=yes
prompt="> "
icons-enabled=no
terminal=foot -e
match-counter=yes

anchor=center
lines=10
width=38
horizontal-pad=16
vertical-pad=10
inner-pad=6

[colors]
background=000000ff
text=ccccccff
message=aaaaaaff
prompt=ffffffff
placeholder=777777ff
input=ffffffff
match=ffffffff
selection=ccccccff
selection-text=000000ff
selection-match=000000ff
counter=888888ff
border=aaaaaaff

[border]
width=1
radius=0
